<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" aria-labelledby="arch-title arch-desc"><desc>A four-stage local pipeline: supported chat page, content script parser, service worker router, export studio renderer, then file outputs. Nothing is sent to a server.</desc><defs><pattern id="a" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#131313" d="M40 0H0v40"/></pattern><marker id="b" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#FF5100" d="m0 0 10 5-10 5z"/></marker></defs><path d="M0 0h1200v560H0z"/><path fill="url(#a)" d="M0 0h1200v560H0z"/><path fill="#FF5100" d="M0 0h1200v4H0z"/><text x="60" y="62" fill="#FF5100" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="11" letter-spacing="3">ARCHITECTURE</text><text x="60" y="102" fill="#FFF" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="-.8">Four stages, all inside the browser</text><text x="60" y="128" fill="#A6A6A6" font-family="'Inter',Arial,sans-serif" font-size="14">Page to file in one pass. No server, no account, no request carrying your conversation.</text><g font-family="'Inter',Arial,sans-serif"><path fill="#0A0A0A" stroke="#2B2B2B" d="M60 160h248v196H60z"/><path fill="#FF5100" d="M60 160h248v3H60z"/><text x="80" y="192" fill="#FF5100" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1.8">01 · SOURCE</text><text x="80" y="222" fill="#FFF" font-size="16" font-weight="700">Chat page</text><text x="80" y="248" fill="#A6A6A6" font-size="11.5">ChatGPT · Claude</text><text x="80" y="266" fill="#A6A6A6" font-size="11.5">Gemini · DeepSeek</text><text x="80" y="296" fill="#6F6F6F" font-size="11">A live conversation, read from</text><text x="80" y="312" fill="#6F6F6F" font-size="11">the page you already have open.</text><path fill="#0A0A0A" stroke="#2B2B2B" d="M340 160h248v196H340z"/><path fill="#FF5100" d="M340 160h248v3H340z"/><text x="360" y="192" fill="#FF5100" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1.8">02 · CONTENT SCRIPT</text><text x="360" y="222" fill="#FFF" font-size="16" font-weight="700">Parser</text><text x="360" y="248" fill="#A6A6A6" font-size="11.5">One adapter per site.</text><text x="360" y="266" fill="#A6A6A6" font-size="11.5">Roles, blocks, formulas, code.</text><text x="360" y="296" fill="#6F6F6F" font-size="11">Candidates are de-duplicated,</text><text x="360" y="312" fill="#6F6F6F" font-size="11">ordered and coverage-counted.</text><path fill="#0A0A0A" stroke="#2B2B2B" d="M620 160h248v196H620z"/><path fill="#FF5100" d="M620 160h248v3H620z"/><text x="640" y="192" fill="#FF5100" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1.8">03 · SERVICE WORKER</text><text x="640" y="222" fill="#FFF" font-size="16" font-weight="700">Router</text><text x="640" y="248" fill="#A6A6A6" font-size="11.5">Popup, context menu,</text><text x="640" y="266" fill="#A6A6A6" font-size="11.5">on-demand injection.</text><text x="640" y="296" fill="#6F6F6F" font-size="11">Hands the parsed chat to the</text><text x="640" y="312" fill="#6F6F6F" font-size="11">studio through session storage.</text><path fill="#0A0A0A" stroke="#2B2B2B" d="M900 160h248v196H900z"/><path fill="#FF5100" d="M900 160h248v3H900z"/><text x="920" y="192" fill="#FF5100" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1.8">04 · EXPORT STUDIO</text><text x="920" y="222" fill="#FFF" font-size="16" font-weight="700">Renderers</text><text x="920" y="248" fill="#A6A6A6" font-size="11.5">HTML · print · PNG</text><text x="920" y="266" fill="#A6A6A6" font-size="11.5">Document + Word XML</text><text x="920" y="296" fill="#6F6F6F" font-size="11">Preview first. The preview is</text><text x="920" y="312" fill="#6F6F6F" font-size="11">exactly what gets written out.</text></g><g fill="none" stroke="#FF5100" stroke-width="1.6" marker-end="url(#b)"><path d="M312 258h22"/><path d="M592 258h22"/><path d="M872 258h22"/></g><path fill="#0A0A0A" stroke="#2B2B2B" d="M60 386h1088v76H60z"/><text x="80" y="414" fill="#A6A6A6" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1.8">OUTPUT · DOWNLOADED LOCALLY</text><g font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="11" letter-spacing="1.2"><path fill="#1A0B04" stroke="#FF5100" d="M80 426h86v24H80z"/><text x="93" y="442" fill="#FF5100">PDF</text><path fill="#111" stroke="#333" d="M174 426h92v24h-92z"/><text x="187" y="442" fill="#FFF">DOCX</text><path fill="#111" stroke="#333" d="M274 426h80v24h-80z"/><text x="287" y="442" fill="#FFF">HTML</text><path fill="#111" stroke="#333" d="M362 426h126v24H362z"/><text x="375" y="442" fill="#FFF">MARKDOWN</text><path fill="#111" stroke="#333" d="M496 426h66v24h-66z"/><text x="509" y="442" fill="#FFF">TXT</text><path fill="#111" stroke="#333" d="M570 426h66v24h-66z"/><text x="583" y="442" fill="#FFF">PNG</text><path fill="#111" stroke="#333" d="M644 426h80v24h-80z"/><text x="657" y="442" fill="#FFF">JSON</text></g><text x="1128" y="442" fill="#6F6F6F" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="9.5" letter-spacing="1.2" text-anchor="end">NO UPLOAD · NO ACCOUNT</text><path fill="#1A0B04" stroke="#FF5100" d="M60 482h1088v44H60z"/><text x="80" y="509" fill="#FF5100" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1.4">PRIVACY BOUNDARY</text><text x="240" y="509" fill="#FFE4D6" font-family="'Inter',Arial,sans-serif" font-size="11.5">Conversation text never leaves the extension. Remote images are fetched only when you allow them, per preview.</text></svg>