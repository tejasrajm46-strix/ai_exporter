<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>AI Exporter</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
      <symbol id="i-select" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12.5l2.6 2.5L16 9.5"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
      <symbol id="i-pdf" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M19 21H5V3h9l5 5z"/><path d="M9 13h1.6a1.4 1.4 0 0 1 0 2.8H9V13zm0 2.8V19"/><path d="M13.5 13v6M13.5 13h2M13.5 16h1.6"/></symbol>
      <symbol id="i-markdown" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M6.5 15.5v-6l2.5 3 2.5-3v6"/><path d="M15 9.5v6M12.8 13.2 15 15.5l2.2-2.3"/></symbol>
      <symbol id="i-txt" viewBox="0 0 24 24"><path d="M4 6h16M4 11h16M4 16h9"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M19 21H5V3h9l5 5z"/><path d="M8.5 13h7M8.5 17h4"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-4.5 4 3.5 3-2.5 4 3.5"/></symbol>
      <symbol id="i-json" viewBox="0 0 24 24"><path d="M9 4C6.8 4 7 6.4 7 8c0 2-2 2-2 2s2 0 2 2c0 1.6-.2 4 2 4"/><path d="M15 4c2.2 0 2 2.4 2 4 0 2 2 2 2 2s-2 0-2 2c0 1.6.2 4-2 4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></symbol>
    </svg>

    <main class="app-shell">
      <header class="topbar">
        <span class="brand-mark" aria-hidden="true"><svg><use href="#i-spark"></use></svg></span>
        <span class="brand-copy">
          <h1>AI Exporter</h1>
          <p>Conversation export</p>
        </span>
        <span class="version">0.2.0</span>
      </header>

      <section class="conversation" aria-labelledby="conversation-title">
        <div class="section-heading">
          <h2 id="conversation-title">Current conversation</h2>
          <span class="site-indicator" id="site-indicator" aria-hidden="true"></span>
        </div>
        <p class="conversation-name" id="conversation-name">Checking this page...</p>
        <p class="conversation-meta" id="conversation-meta">Waiting for page detection</p>
        <p class="status-message" id="status-message" role="status" aria-live="polite">
          Open an AI conversation to get started.
        </p>
      </section>

      <button class="selection-button" id="custom-export" type="button" aria-pressed="false" disabled>
        <svg class="icon" aria-hidden="true" id="custom-export-icon"><use href="#i-select"></use></svg>
        <span id="custom-export-label">Select messages</span>
      </button>

      <section class="formats" aria-labelledby="formats-title">
        <div class="section-heading">
          <h2 id="formats-title">Quick export</h2>
          <span class="scope-note" id="scope-note">Whole conversation</span>
        </div>
        <div class="format-grid">
          <button class="format-button" type="button" data-format="pdf" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-pdf"></use></svg><span>PDF</span>
          </button>
          <button class="format-button" type="button" data-format="markdown" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-markdown"></use></svg><span>Markdown</span>
          </button>
          <button class="format-button" type="button" data-format="txt" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-txt"></use></svg><span>Text</span>
          </button>
          <button class="format-button" type="button" data-format="docx" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-doc"></use></svg><span>DOCX</span>
          </button>
          <button class="format-button" type="button" data-format="image" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-image"></use></svg><span>Image</span>
          </button>
          <button class="format-button" type="button" data-format="json" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-json"></use></svg><span>JSON</span>
          </button>
        </div>
      </section>

      <details class="settings">
        <summary>Export settings</summary>
        <div class="settings-list">
          <label class="setting-row" for="include-timestamps">
            <span>Include timestamps</span>
            <input id="include-timestamps" type="checkbox">
          </label>
          <label class="setting-row" for="code-highlighting">
            <span>Preserve code highlighting</span>
            <input id="code-highlighting" type="checkbox">
          </label>
          <label class="setting-row" for="doc-theme">
            <span>Document theme</span>
            <select id="doc-theme">
              <option value="light">1 &middot; Light (colourful)</option>
              <option value="dark">2 &middot; Dark</option>
              <option value="print">3 &middot; Light (printable)</option>
            </select>
          </label>
          <label class="setting-row" for="doc-mode">
            <span>Word document</span>
            <select id="doc-mode">
              <option value="color">1 &middot; Light &amp; colourful</option>
              <option value="bw">2 &middot; Clean black &amp; white</option>
            </select>
          </label>
        </div>
      </details>

      <footer class="footer-note">Your conversation stays on this device.</footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
