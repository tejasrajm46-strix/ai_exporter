<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" aria-labelledby="hero-title hero-desc"><desc>Black editorial banner with the AI Exporter mark, wordmark, format chips and a sample exported document page.</desc><defs><pattern id="a" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#131313" d="M40 0H0v40"/></pattern></defs><path d="M0 0h1200v420H0z"/><path fill="url(#a)" d="M0 0h1200v420H0z"/><path fill="#FF5100" d="M0 0h1200v4H0z"/><path stroke="#2B2B2B" d="M72 78h88v88H72z"/><path fill="#FFF" d="M88.5 94.5H138v11H99.5v11H149v11H99.5v11h33v11h-44z"/><path fill="#FF5100" d="M99.5 116.5H149v11H99.5z"/><text x="184" y="132" fill="#FFF" font-family="'Archivo Black','Arial Black',Arial,sans-serif" font-size="57" font-weight="900" letter-spacing="-1.5">AI EXPORTER</text><text x="186" y="160" fill="#A6A6A6" font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="12" letter-spacing="2.6">EXPORT AI CONVERSATIONS AS REAL DOCUMENTS</text><text x="74" y="228" fill="#FFF" font-family="'Inter',Arial,sans-serif" font-size="17">ChatGPT, Claude, Gemini and DeepSeek chats, saved as files you actually own.</text><text x="74" y="254" fill="#A6A6A6" font-family="'Inter',Arial,sans-serif" font-size="17">Pick the messages, pick the format, check the preview. No account, no upload.</text><g font-family="'JetBrains Mono',ui-monospace,Consolas,monospace" font-size="10.5" letter-spacing="1.4"><path fill="#0A0A0A" stroke="#2B2B2B" d="M74 288h96v26H74z"/><text x="86" y="305" fill="#FFF">7 FORMATS</text><path fill="#0A0A0A" stroke="#2B2B2B" d="M180 288h132v26H180z"/><text x="192" y="305" fill="#A6A6A6">MANIFEST V3</text><path fill="#1A0B04" stroke="#FF5100" d="M322 288h150v26H322z"/><text x="334" y="305" fill="#FF5100">LOCAL ONLY</text><path fill="#0A0A0A" stroke="#2B2B2B" d="M482 288h170v26H482z"/><text x="494" y="305" fill="#A6A6A6">ZERO TELEMETRY</text></g><path fill="#101010" d="M792 82h344v272H792z"/><path fill="#FFF" stroke="#